services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anibet
      POSTGRES_PASSWORD: anibet_dev_only   # dev local uniquement — jamais en prod
      POSTGRES_DB: anibet
    ports:
      - "5432:5432"   # permet de se connecter avec `psql` depuis la machine hôte
    volumes:
      - anibet_pgdata:/var/lib/postgresql/data
      # Les migrations tournent automatiquement à la création du volume,
      # dans l'ordre alphabétique des fichiers.
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anibet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "5000:8000"
    env_file:
      - .env
    environment:
      # Écrase le DATABASE_URL du .env pour pointer vers le service `db`
      # par son nom réseau Docker, pas localhost.
      DATABASE_URL: postgresql://anibet:anibet_dev_only@db:5432/anibet
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app   # live-reload pendant le développement

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - 8081:8080
    depends_on:
      - db

  test-report:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /reports
    command: python -m http.server 8080
    ports:
      - "8082:8080"
    volumes:
      - ./tests:/reports:ro   # lecture seule : ce service ne fait que servir report.html, jamais l'écrire

volumes:
  anibet_pgdata:
