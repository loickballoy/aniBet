name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anibet
          POSTGRES_PASSWORD: anibet_dev_only
          POSTGRES_DB: anibet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anibet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Base jetable : conftest.py la recrée et y rejoue toutes les migrations.
      DATABASE_URL: postgresql://anibet:anibet_dev_only@localhost:5432/anibet_test
      SECRET_KEY: ci-only-secret
      SESSION_SECRET_KEY: ci-only-session-secret
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/callback/google
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_REDIRECT_URI: http://localhost:8000/auth/callback/discord
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install psql (used by conftest to replay migrations)
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/report.html

  frontend:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
