name: Daily Timestamp Commit

# Give the workflow permission to write repository contents
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Update timestamp file
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last-updated.txt

      - name: Commit changes
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add last-updated.txt
          git commit -m "chore: update timestamp $(date -u +"%Y-%m-%d %H:%M:%S UTC")" || echo "No changes to commit"

      - name: Push changes
        run: git push origin HEAD:${{ github.ref_name }}
